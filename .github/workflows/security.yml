name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:


  # 1. SAST - ANÁLISE ESTÁTICA DO CÓDIGO


  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Executar análise SAST
        run: |
          bandit -r . \
            -x ./venv,./.venv,./tests \
            -f json \
            -o bandit-report.json \
            --severity-level medium

      - name: Salvar relatório SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json



  # 2. SCA - ANÁLISE DE DEPENDÊNCIAS


  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Executar análise de dependências
        run: |
          pip-audit \
            -r requirements.txt \
            --format json \
            --output pip-audit-report.json

      - name: Salvar relatório SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json



  # 3. TESTES AUTOMATIZADOS DE SEGURANÇA


  security-tests:
    name: Pytest - Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes de segurança
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///./agendamento_test.db"
          SECRET_KEY: "chave_de_teste_com_mais_de_32_caracteres_segura"
        run: |
          pytest tests/test_exercicio12_seguranca.py -v



  # 4. SECURITY GATE


  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    needs:
      - sast
      - sca
      - security-tests

    steps:
      - name: Verificar resultado das análises
        run: |
          echo "=========================================="
          echo "        DEVSECOPS SECURITY GATE"
          echo "=========================================="
          echo ""
          echo "SAST: aprovado"
          echo "SCA: aprovado"
          echo "Testes de segurança: aprovados"
          echo ""
          echo "Critério de bloqueio:"
          echo "Vulnerabilidades High ou Critical bloqueiam o pipeline."
          echo ""
          echo "Security Gate aprovado."